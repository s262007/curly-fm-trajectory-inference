# @package _global_

# Train Curly-FM on the NLSB EB scRNA-seq dataset.
#
# Run with:
#   python src/train.py experiment=nlsb
#
# Data: https://github.com/take-koshizuka/NLSB/tree/main/data
# Place the three .npz files into data/nlsb/ before running.

defaults:
  - override /data: nlsb
  - override /model: nlsb_curlycfm

tags: ["nlsb", "eb", "100d"]

seed: 42

trainer:
  max_epochs: 200
  gradient_clip_val: 1.0

data:
  batch_size: 256
  dim: 100
  train_ts: [0, 2, 4]
  val_ts:   [1, 3]

model:
  net:
    dim: 100
    out_dim: 100
  geodesic_net:
    dim: 200
    out_dim: 100
